<form [formGroup]="searchForm" (ngSubmit)="onSearch()">
  <div class="search-inputs mb-3 d-flex gap-2">
    <app-input type="search" [placeholder]="namePlaceholder" iconStart="bi bi-search" formControlName="name" class="flex-grow-1"></app-input>
    <app-input type="text" [placeholder]="categoryPlaceholder" iconStart="bi bi-tag" formControlName="category" class="flex-grow-1"></app-input>
  </div>
  <div class="d-flex justify-content-center">
    <app-button type="submit" label="Buscar"></app-button>
  </div>
</form>
