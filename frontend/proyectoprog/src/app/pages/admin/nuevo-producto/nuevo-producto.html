<app-back-button routerLink="/admin-menu"></app-back-button>
    <div class="stats-card">
      
      <div class="actions-grid">
        <!-- <a routerLink="admin-menu" class="back-btn"><i class=" bi-arrow-left"><button >&larr;</button></i></a> -->
        
        <h4 class="ms-3 mb-0 fw-bold align">Nuevo Producto</h4>
      </div>
      
      
      <form>
        <div class="mb-3">
          <label class="form-label">Nombre del producto</label>
          <input type="text" class="form-control" placeholder="Ej: Pizza Napolitana">
        </div>
  
        <div class="mb-3">
          <label class="form-label">Precio</label>
          <input type="number" class="form-control" placeholder="10000">
        </div>
  
        <div class="mb-3">
          <label class="form-label">Categoría</label>
          <input type="text" class="form-control" placeholder="Pizzas">
        </div>
  
        <div class="mb-3">
          <label class="form-label">Descripción</label>
          <textarea class="form-control" rows="3" placeholder="Describe el producto..."></textarea>
        </div>
  
        <div class="mb-3">
          <label class="form-label">Imagen</label>
          <input type="file" class="form-control">
        </div>
  
        <button type="submit" class="btn btn-guardar text-white">Guardar Producto</button>
      </form>
    </div>
