<!-- Contenedor rectangular del formulario -->
<section class="login-section d-flex justify-content-center align-items-center">
  <app-universal-card variant="glass" size="xl" padding="2xl" borderRadius="xl" class="login-card">
    <!-- Banner superior (ahora dentro de la tarjeta) -->
    <header class="login-header text-center">
      <h1 class="app-title">Bienvenido a <span class="highlight">Rotisería UM</span></h1>
      <p class="subtitle">Tu sabor favorito, más cerca que nunca</p>
    </header>

    <div class="text-center mb-4">
      <img src="assets/imagenpollo.jpg" alt="Logo Rotisería UM" class="login-logo mb-3" />
      <h2 class="fw-bold">Iniciar Sesión</h2>
    </div>

    <form>
      <app-input
        type="email"
        label="Correo Electrónico"
        placeholder="ejemplo@gmail.com"
        iconStart="bi bi-envelope-fill"
      >
      </app-input>

      <app-input
        type="password"
        label="Contraseña"
        placeholder="********"
        iconStart="bi bi-lock-fill"
      >
      </app-input>

      <app-button
        (click)="irLogin()"
        variant="secondary"
        [fullWidth]="true"
        size="lg"
        class="mt-5"
        label="Ingresar"
      ></app-button>
      <app-action-bttn 
      label="Iniciar Sesión"
      link="/menu"  

      (buttonClick)="''">
    </app-action-bttn> 
      <div class="text-center mt-4 extra-links">
        <small>¿No tenés cuenta? <a routerLink="/register">Creá tu cuenta</a></small>
      </div>

    </form>
  </app-universal-card>
</section>
