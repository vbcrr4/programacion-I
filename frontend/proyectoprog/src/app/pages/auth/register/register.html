 <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotisería UM - Crear Cuenta</title>
  <div class="register-card">
    <h2 class="text-center mb-4">Crear Cuenta</h2>
    <form>
      <div class="mb-3">
        <input type="text" class="form-control" placeholder="Nombre completo">
      </div>
      <div class="mb-3">
        <input type="email" class="form-control" placeholder="Email">
      </div>
      <div class="mb-3">
        <input type="password" class="form-control" placeholder="Contraseña">
      </div>
      <div class="mb-3">
        <input type="password" class="form-control" placeholder="Confirmar contraseña">
      </div>
    <a routerLink="/menu" class="btn-login d-block text-center">Registrarse</a>
    </form>
    <div class="text-center mt-3 extra-links">
      <span>¿Ya tenés cuenta? <a routerLink="/login">Inicia sesión</a></span>
    </div>
  </div>
