<!-- Banner superior -->
<header class="register-header text-center">
  <h1 class="app-title">Unite a <span class="highlight">Rotisería UM</span></h1>
  <p class="subtitle">Creá tu cuenta y pedí tus platos favoritos</p>
</header>

<!-- Contenedor del formulario -->
<div class="register-container">
  <div class="register-card">
    <h2 class="text-center mb-4">Crear Cuenta</h2>

    <form>
      <div class="mb-3">
        <label class="form-label">Nombre completo</label>
        <input type="text" class="form-control" placeholder="Ej: Juan Pérez" />
      </div>

      <div class="mb-3">
        <label class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" placeholder="Ej: ejemplo@gmail.com" />
      </div>

      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" class="form-control" placeholder="********" />
      </div>

      <div class="mb-4">
        <label class="form-label">Confirmar contraseña</label>
        <input type="password" class="form-control" placeholder="********" />
      </div>

      <!-- ✅ Botón con routerLink -->
      <a routerLink="/menu" class="btn-register w-100 text-center d-block">Registrarse</a>

      <div class="text-center mt-4 extra-links">
        <small>¿Ya tenés cuenta? <a routerLink="/login">Iniciá sesión</a></small>
      </div>
    </form>
  </div>
</div>
