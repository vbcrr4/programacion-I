<section class="register-section d-flex justify-content-center align-items-center">
  <app-universal-card
    variant="glass"
    size="xl"
    padding="2xl"
    borderRadius="xl"
    class="register-card"
  >
    <!-- Banner superior (ahora dentro de la tarjeta) -->
    <header class="register-header text-center">
      <h1 class="app-title">Unite a <span class="highlight">Rotisería UM</span></h1>
      <p class="subtitle">Creá tu cuenta y pedí tus platos favoritos</p>
    </header>

    <div class="text-center mb-4">
      <h2 class="fw-bold">Crear Cuenta</h2>
    </div>

    <form [formGroup]="registerForm">
      <app-input
        type="text"
        label="Nombre completo"
        placeholder="Ej: Juan Pérez"
        iconStart="bi bi-person-fill"
        formControlName="name"
      >
      </app-input>

      <app-input
        type="email"
        label="Correo electrónico"
        placeholder="ejemplo@gmail.com"
        iconStart="bi bi-envelope-fill"
        formControlName="email"
      >
      </app-input>

      <app-input
        type="password"
        label="Contraseña"
        placeholder="********"
        iconStart="bi bi-lock-fill"
        formControlName="password"
      >
      </app-input>


      <app-input
        type="number"
        label="Teléfono"
        placeholder="261..."
        iconStart="bi bi-phone-fill"
        formControlName="cellphone"
      >
      </app-input>

      <app-input
        type="text"
        label="Dirección"
        placeholder="Av. Siempre Viva 123"
        iconStart="bi bi-geo-alt-fill"
        formControlName="address"
      >
      </app-input>

      <div *ngIf="errorMessage" class="alert alert-danger mt-3" role="alert">
        {{ errorMessage }}
      </div>

      <app-action-bttn
        buttonType="button"
        class="mt-5"
        label="Registrarse"
        [disabled]="registerForm.invalid"
        (buttonClick)="onSubmit()"
      >
      </app-action-bttn>

      <div class="text-center mt-4 extra-links">
        <small>¿Ya tenés cuenta? <a routerLink="/login">Iniciá sesión</a></small>
      </div>
    </form>
  </app-universal-card>
</section>
