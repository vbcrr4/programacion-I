<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gestión de Menú - Rotisería UM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <style>
    body {
      background: linear-gradient(180deg, #1e003e, #000020);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      padding-bottom: 1rem; 
      /* IGUAL EN ADMIN MENU y EMPLEADO PANEL Y EMPLEADO PANEL */
    }

    .stats-card {
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 1rem;
      padding: 1rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
      /* IGUAL EN EMPLEADO PANEL Y ADMIN MENU */
    }
    .menu-item {
      background-color: rgba(255, 255, 255, 0.08);
      border-radius: 0.75rem;
      padding: 0.8rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .item-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .item-icon {
      background: #9b4dff;
      border-radius: 0.5rem;
      padding: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      min-width: 42px;
      min-height: 42px;
    }
    .item-text {
      display: flex;
      flex-direction: column;
      text-align: left;
    }
    .item-text .price {
      font-size: 0.9rem;
      color: #bbb;
    }

    .btn-edit {
      background: #9b4dff;
      border: none;
      color: #fff;
    }
    .btn-edit:hover { background: #7b3ce3; }
    .btn-delete {
      background: #e63946;
      border: none;
      color: #fff;
    }
    .btn-delete:hover { background: #c1121f; }
    .back-btn {
      position: absolute;
      top: 1rem;
      left: 1rem;
      color: white;
      font-size: 1.5rem;
      text-decoration: none;
    }
    .back-btn:hover { color: #9b4dff; }
    .fab-btn {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: #9b4dff;
      border: none;
      border-radius: 50%;
      width: 55px;
      height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: #fff;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      z-index: 1050;
    }
    .fab-btn:hover { background: #7b3ce3; }
  </style>
</head>
<body>

  
  
  <a href="admin_menu.html" class="back-btn"><i class="bi bi-arrow-left"></i></a>

  <div class="stats-card">
    <h4 class="text-center mb-3">Gestión de Menú</h4>
    <hr class="border-light">

  
    <div id="menuItems">
      <div class="menu-item">
        <div class="item-info">
          <div class="item-icon"><i class="bi bi-emoji-smile"></i></div>
          <div class="item-text">
            <span class="item-name">Napolitana</span>
            <span class="price">$10.000</span>
          </div>
        </div>
        <div class="action-buttons">
          <button class="btn btn-edit edit-btn"><i class="bi bi-pencil"></i></button>
          <button class="btn btn-delete delete-btn"><i class="bi bi-x-lg"></i></button>
        </div>
      </div>

      <div class="menu-item">
        <div class="item-info">
          <div class="item-icon"><i class="bi bi-emoji-smile"></i></div>
          <div class="item-text">
            <span class="item-name">Muzzarella</span>
            <span class="price">$9.000</span>
          </div>
        </div>
        <div class="action-buttons">
          <button class="btn btn-edit edit-btn"><i class="bi bi-pencil"></i></button>
          <button class="btn btn-delete delete-btn"><i class="bi bi-x-lg"></i></button>
        </div>
      </div>
    </div>
  </div>

  
  <button class="fab-btn" data-bs-toggle="modal" data-bs-target="#nuevoProductoModal">
    <i class="bi bi-plus-lg"></i>
  </button>

  
  <div class="modal fade" id="nuevoProductoModal" tabindex="-1" aria-labelledby="nuevoProductoLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark text-light">
        <div class="modal-header">
          <h5 class="modal-title" id="nuevoProductoLabel">Agregar nuevo producto</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <form id="nuevoProductoForm">
            <div class="mb-3">
              <label for="nombreProducto" class="form-label">Nombre del producto</label>
              <input type="text" class="form-control" id="nombreProducto" required>
            </div>
            <div class="mb-3">
              <label for="precioProducto" class="form-label">Precio</label>
              <input type="number" class="form-control" id="precioProducto" required>
            </div>
            <div class="mb-3">
              <label for="iconoProducto" class="form-label">Ícono (opcional)</label>
              <input type="text" class="form-control" id="iconoProducto" placeholder="ej: bi-emoji-smile">
              <div class="form-text text-secondary">Usa clases de Bootstrap Icons</div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" id="guardarNuevo">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  
  <div class="modal fade" id="editarProductoModal" tabindex="-1" aria-labelledby="editarProductoLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark text-light">
        <div class="modal-header">
          <h5 class="modal-title" id="editarProductoLabel">Editar producto</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <form id="editarProductoForm">
            <div class="mb-3">
              <label for="editNombre" class="form-label">Nombre del producto</label>
              <input type="text" class="form-control" id="editNombre" required>
            </div>
            <div class="mb-3">
              <label for="editPrecio" class="form-label">Precio</label>
              <input type="number" class="form-control" id="editPrecio" required>
            </div>
            <div class="mb-3">
              <label for="editIcono" class="form-label">Ícono (clase)</label>
              <input type="text" class="form-control" id="editIcono" placeholder="ej: bi-emoji-smile">
              <div class="form-text text-secondary">Usa clases de Bootstrap Icons</div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
  
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
  
          <button type="button" class="btn btn-primary" id="guardarEdicion">Guardar cambios</button>
        </div>
      </div>
    </div>
  </div>

  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
