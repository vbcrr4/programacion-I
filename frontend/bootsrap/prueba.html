<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gestión Clientes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <style>
    body {
      background: #333;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .main-container {
      max-width: 420px;
      width: 100%;
    }

    .card {
      background: linear-gradient(180deg, #2a003f, #0b0020);
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(0,0,0,0.6);
      color: #fff;
      overflow: hidden;
    }

    /* Header */
    .card-header-custom {
      padding: 1rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .back-btn {
      background: rgba(255,255,255,0.15);
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      color: white;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .back-btn:hover {
      background: rgba(255,255,255,0.3);
    }
    .title {
      font-weight: bold;
      font-size: 1.2rem;
      margin: 0;
    }

    /* Search */
    .search-box {
      padding: 0 1rem 1rem;
    }
    .search-box input {
      background: rgba(255,255,255,0.1);
      border: none;
      border-radius: 10px;
      color: #fff;
    }
    .search-box input::placeholder {
      color: #bbb;
    }

    /* Tabs */
    .filter-tabs {
      padding: 0 1rem 1rem;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 0.4rem 0.9rem;
      border-radius: 20px;
      font-size: 0.85rem;
      border: none;
      cursor: pointer;
      background: rgba(255,255,255,0.12);
      color: #fff;
      flex: 1 1 auto;
      text-align: center;
    }
    .filter-btn.active {
      background: #9b4dff;
    }

    /* Cliente item */
    .client-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.8rem;
      margin: 0.6rem 1rem;
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
      flex-wrap: wrap;
      gap: 0.8rem;
    }
    .client-left {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex: 1 1 auto;
      min-width: 200px;
    }
    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #fff;
      background: #9b4dff;
      flex-shrink: 0;
    }
    .client-info p {
      margin: 0;
      font-size: 0.85rem;
    }
    .client-info .name {
      font-weight: bold;
      font-size: 0.95rem;
    }
    .status {
      font-size: 0.75rem;
      border-radius: 6px;
      padding: 0.2rem 0.5rem;
      margin-top: 0.2rem;
      display: inline-block;
    }
    .status-active { background: #198754; }
    .status-blocked { background: #dc3545; }

    /* Action buttons */
    .client-actions {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      flex-shrink: 0;
    }
    .action-btn {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      cursor: pointer;
      color: #fff;
    }
    .btn-remove { background: #6c757d; }
    .btn-approve { background: #198754; }
    .btn-block { background: #dc3545; }

    /* Responsive */
    @media (max-width: 480px) {
      .title { font-size: 1rem; }
      .filter-btn { font-size: 0.75rem; padding: 0.3rem 0.6rem; }
      .client-item { padding: 0.6rem; margin: 0.4rem 0.6rem; }
      .avatar { width: 40px; height: 40px; font-size: 0.85rem; }
      .client-info p { font-size: 0.8rem; }
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="card">
      
      <!-- Header -->
      <div class="card-header-custom">
        <button class="back-btn"><i class="bi bi-arrow-left"></i></button>
        <h5 class="title">Gestión Clientes</h5>
      </div>

      <!-- Search -->
      <div class="search-box">
        <input type="text" class="form-control" placeholder="Buscar cliente..."/>
      </div>

      <!-- Tabs -->
      <div class="filter-tabs">
        <button class="filter-btn active">Todos</button>
        <button class="filter-btn">Activos</button>
        <button class="filter-btn">Bloqueados</button>
        <button class="filter-btn">Frecuentes</button>
      </div>

      <!-- Cliente 1 -->
      <div class="client-item">
        <div class="client-left">
          <div class="avatar">JP</div>
          <div class="client-info">
            <p class="name">Juan Pérez</p>
            <p>15 pedidos realizados</p>
            <p>Cliente desde: Ene 2024</p>
            <span class="status status-active">Cliente activo</span>
          </div>
        </div>
        <div class="client-actions">
          <button class="action-btn btn-remove">-</button>
          <button class="action-btn btn-block">⛔</button>
        </div>
      </div>

      <!-- Cliente 2 -->
      <div class="client-item">
        <div class="client-left">
          <div class="avatar" style="background:#9b4dff;">CS</div>
          <div class="client-info">
            <p class="name">Carlos Silva</p>
            <p>2 pedidos cancelados</p>
            <p>Última actividad: Hace 5 días</p>
            <span class="status status-blocked">Bloqueado</span>
          </div>
        </div>
        <div class="client-actions">
          <button class="action-btn btn-remove">-</button>
          <button class="action-btn btn-approve">✔</button>
        </div>
      </div>

      <!-- Cliente 3 -->
      <div class="client-item">
        <div class="client-left">
          <div class="avatar" style="background:#9b4dff;">MG</div>
          <div class="client-info">
            <p class="name">María González</p>
            <p>32 pedidos realizados</p>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
