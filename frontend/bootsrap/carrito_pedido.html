<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito - Rotisería UM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
        background: #1a1a2e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .card-carrito {
      max-width: 400px;
      margin: 2rem auto;
      padding: 1.5rem;
      border-radius: 20px;
      background: linear-gradient(180deg, #1b0026, #1a003d);
      box-shadow: 0px 0px 20px rgba(0,0,0,0.5);
    }
    .card-carrito h2 {
      font-weight: bold;
    }
    .tab-btn {
      border-radius: 30px;
      padding: 0.4rem 1.2rem;
      font-weight: bold;
      border: none;
    }
    .tab-btn.active {
      background: #9d4edd;
      color: #fff;
    }
    .btn-total {
      background: #9d4edd;
      color: #fff;
      border-radius: 30px;
      font-weight: bold;
      padding: 0.8rem;
      width: 100%;
      border: none;
    }
    .item {
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding: 0.8rem 0;
    }
    .item img {
      width: 70px;
      border-radius: 10px;
      margin-right: 10px;
    }
    .precio {
      color: #f5a623;
      font-weight: bold;
    }
  </style>
</head>
<body>

  


  
  <div class="card-carrito text-center">
    <h2>Carrito</h2>
    <div class="d-flex justify-content-center my-3 gap-2">
      <button class="tab-btn active">Pedido</button>
      <button class="tab-btn btn-dark">Envío</button>
      <button class="tab-btn btn-dark">Calificar</button>
    </div>

    
    <div class="item d-flex align-items-center">
      <img src="img/pizza.jpg" alt="Pizza">
      <div class="text-start">
        <div>Muzza <span class="precio">$10.000,98</span></div>
        <small>1 Unidad/es</small>
      </div>
    </div>
    <div class="item d-flex align-items-center">
      <img src="img/pizza.jpg" alt="Pizza">
      <div class="text-start">
        <div>Muzza <span class="precio">$10.000,98</span></div>
        <small>1 Unidad/es</small>
      </div>
    </div>
    <div class="item d-flex align-items-center">
      <img src="img/pizza.jpg" alt="Pizza">
      <div class="text-start">
        <div>Muzza <span class="precio">$10.000,98</span></div>
        <small>1 Unidad/es</small>
      </div>
    </div>

    
    <div class="mt-3">
      <button class="btn-total">Total Pedido: $100.000</button>
    </div>
  </div>

  
  <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="offcanvasCarrito">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title">Carrito</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <div class="d-flex justify-content-center my-3 gap-2">
        <button class="tab-btn active">Pedido</button>
        <button class="tab-btn btn-dark">Envío</button>
        <button class="tab-btn btn-dark">Calificar</button>
      </div>

      <!-- Items -->
      <div class="item d-flex align-items-center">
        <img src="img/pizza.jpg" alt="Pizza">
        <div class="text-start">
          <div>Muzza <span class="precio">$10.000,98</span></div>
          <small>1 Unidad/es</small>
        </div>
      </div>
      <div class="item d-flex align-items-center">
        <img src="img/pizza.jpg" alt="Pizza">
        <div class="text-start">
          <div>Muzza <span class="precio">$10.000,98</span></div>
          <small>1 Unidad/es</small>
        </div>
      </div>
      <div class="item d-flex align-items-center">
        <img src="img/pizza.jpg" alt="Pizza">
        <div class="text-start">
          <div>Muzza <span class="precio">$10.000,98</span></div>
          <small>1 Unidad/es</small>
        </div>
      </div>

      
      <div class="mt-3">
        <button class="btn-total">Total Pedido: $100.000</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
