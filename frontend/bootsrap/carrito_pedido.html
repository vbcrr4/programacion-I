<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito - Rotisería UM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #1a1a2e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      padding: 20px;
    }
    .card-carrito {
      max-width: 400px;
      margin: 2rem auto;
      padding: 1.5rem;
      border-radius: 20px;
      background: linear-gradient(180deg, #1b0026, #1a003d);
      box-shadow: 0px 0px 20px rgba(0,0,0,0.5);
    }
    .card-carrito h2 {
      font-weight: bold;
    }
    .tab-btn {
      border-radius: 30px;
      padding: 0.4rem 1.2rem;
      font-weight: bold;
      border: none;
      background: transparent;
      color: #fff;
    }
    .tab-btn.active {
      background: #9d4edd;
      color: #fff;
    }
    .btn-total {
      background: #9d4edd;
      color: #fff;
      border-radius: 30px;
      font-weight: bold;
      padding: 0.8rem;
      width: 100%;
      border: none;
      margin-top: 15px;
    }
    .item {
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding: 0.8rem 0;
    }
    .item img {
      width: 70px;
      border-radius: 10px;
      margin-right: 10px;
    }
    .precio {
      color: #f5a623;
      font-weight: bold;
    }
    
    .header-carrito {
      background: #9d4edd;
      border-radius: 15px;
      padding: 0.8rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-weight: bold;
    }
    .header-carrito .badge {
      background: #2b0040;
      color: #fff;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 50%;
      padding: 0.5rem 0.9rem;
    }

    
    .marco-morado {
      border: 3px solid #9d4edd;
      border-radius: 15px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    
    .info-envio {
      background: rgba(157, 78, 221, 0.2);
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
    }
    
    .direccion {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 15px;
      margin-top: 15px;
    }
    
    .tab-content {
      min-height: 300px;
    }
    
    textarea {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid #9d4edd;
      color: white;
      border-radius: 10px;
    }
    
    textarea:focus {
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border-color: #9d4edd;
      box-shadow: 0 0 0 0.2rem rgba(157, 78, 221, 0.25);
    }
  </style>
</head>
<body>

  <div class="card-carrito text-center">
    <h2>Carrito</h2>

    <div class="header-carrito">
      <span class="badge">2</span>
      <span>Items pedidos</span>
    </div>

    <div class="marco-morado">
      <!-- Tabs -->
      <div class="d-flex justify-content-center my-3 gap-2">
        <button class="tab-btn active" onclick="cambiarTab('pedido')">Pedido</button>
        <button class="tab-btn" onclick="cambiarTab('envio')">Envío</button>
        <button class="tab-btn" onclick="cambiarTab('calificar')">Calificar</button>
      </div>

      <!-- Contenido de las pestañas -->
      <div class="tab-content">
        <!-- Pestaña Pedido -->
        <div id="tab-pedido" class="tab-pane active">
          <div class="item d-flex align-items-center">
            <img src="https://via.placeholder.com/70" alt="Pizza">
            <div class="text-start">
              <div>Muzza <span class="precio">$10.000,98</span></div>
              <small>1 Unidad/es</small>
            </div>
          </div>
          <div class="item d-flex align-items-center">
            <img src="https://via.placeholder.com/70" alt="Pizza">
            <div class="text-start">
              <div>Muzza <span class="precio">$10.000,98</span></div>
              <small>1 Unidad/es</small>
            </div>
          </div>
          <div class="item d-flex align-items-center">
            <img src="https://via.placeholder.com/70" alt="Pizza">
            <div class="text-start">
              <div>Muzza <span class="precio">$10.000,98</span></div>
              <small>1 Unidad/es</small>
            </div>
          </div>
          <button class="btn-total">Total Pedido: $100.000</button>
        </div>

        <!-- Pestaña Envío -->
        <div id="tab-envio" class="tab-pane" style="display: none;">
          <div class="info-envio text-start">
            <p><strong>Precio del Envío:</strong> <span class="precio">$5.000</span></p>
            <p><strong>Estado del envío:</strong> En camino</p>
          </div>
          
          <div class="direccion text-start">
            <p class="mb-1"><strong>Dirección de entrega:</strong></p>
            <p class="mb-0">Chesapeake Avenue</p>
            <p class="mb-0">Whittier Street</p>
          </div>
        </div>

        <!-- Pestaña Calificar -->
        <div id="tab-calificar" class="tab-pane" style="display: none;">
          <div class="item d-flex align-items-center">
            <img src="https://via.placeholder.com/70" alt="Pizza">
            <div class="text-start">
              <div>Muzza</div>
              <small>1 Unidad/es</small>
            </div>
          </div>
          <div class="item d-flex align-items-center">
            <img src="https://via.placeholder.com/70" alt="Pizza">
            <div class="text-start">
              <div>Muzza</div>
              <small>1 Unidad/es</small>
            </div>
          </div>
          
          <div class="mt-3 text-start">
            <label for="comentarios" class="form-label">Comentarios:</label>
            <textarea class="form-control" id="comentarios" rows="3" placeholder="Escribe tu opinión sobre el pedido..."></textarea>
          </div>
          
          <button class="btn-total">Enviar Calificación</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function cambiarTab(tabName) {
      // Ocultar todos los tabs
      document.querySelectorAll('.tab-pane').forEach(tab => {
        tab.style.display = 'none';
      });
      
      // Mostrar el tab seleccionado
      document.getElementById('tab-' + tabName).style.display = 'block';
      
      // Actualizar botones activos
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      
      event.target.classList.add('active');
    }
  </script>
</body>
</html>
