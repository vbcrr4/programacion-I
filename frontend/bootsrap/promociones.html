<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promociones - Rotisería UM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(180deg, #1e003e, #000020); /* degradado */
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .promo-card {
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 1rem;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
      color: #fff;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
    }
    .btn-purple {
      background-color: #9b4dff;
      border: none;
    }
    .btn-purple:hover {
      background-color: #7b3ce3;
    }
    .back-btn {
      position: absolute;
      top: 1rem;
      left: 1rem;
      color: white;
      font-size: 1.5rem;
      text-decoration: none;
    }
    .back-btn:hover {
      color: #9b4dff;
    }
    /* 🔹 Campos con fondo oscuro */
    .form-control, .form-select {
      background-color: rgba(255, 255, 255, 0.1); /* tono más claro que el fondo */
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
    }
    .form-control::placeholder, .form-select {
      color: rgba(255, 255, 255, 0.6);
    }
    .form-control:focus, .form-select:focus {
      background-color: rgba(255, 255, 255, 0.15);
      border-color: #9b4dff;
      box-shadow: 0 0 0 0.25rem rgba(155, 77, 255, 0.25);
      color: #fff;
    }
    label {
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- Botón volver -->
  <a href="index.html" class="back-btn"><i class="bi bi-arrow-left"></i></a>

  <div class="promo-card">
    <h3 class="text-center mb-4">Promociones</h3>

    <form>
      <div class="mb-3">
        <label for="asuntoEmail" class="form-label">Asunto del email</label>
        <input type="text" class="form-control" id="asuntoEmail" placeholder="¡Oferta especial en pizzas!">
      </div>

      <div class="mb-3">
        <label for="destinatarios" class="form-label">Destinatarios</label>
        <select id="destinatarios" class="form-select">
          <option>Todos los usuarios</option>
          <option>Clientes frecuentes</option>
          <option>Nuevos clientes</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="mensaje" class="form-label">Mensaje</label>
        <textarea id="mensaje" class="form-control" rows="4" placeholder="Escribe tu mensaje promocional aquí..."></textarea>
      </div>

      <div class="mb-3">
        <label for="codigoDescuento" class="form-label">Código de descuento (opcional)</label>
        <input type="text" class="form-control" id="codigoDescuento" placeholder="PIZZA2X1">
      </div>

      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="enviarUsuarios" checked>
        <label class="form-check-label" for="enviarUsuarios">Se enviará a 156 usuarios</label>
      </div>

      <button type="submit" class="btn btn-purple w-100 py-2">Enviar Promoción</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
