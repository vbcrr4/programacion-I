<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito - Rotisería UM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #1a1a2e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .card-carrito {
      max-width: 400px;
      margin: 2rem auto;
      padding: 1.5rem;
      border-radius: 20px;
      background: linear-gradient(180deg, #1b0026, #1a003d);
      box-shadow: 0px 0px 20px rgba(0,0,0,0.5);
    }
    .card-carrito h2 {
      font-weight: bold;
    }

    .tab-btn {
      border-radius: 30px;
      padding: 0.4rem 1.2rem;
      font-weight: bold;
      border: none;
      text-decoration: none;
      color: #fff;
    }
    .tab-btn.active {
      background: #9d4edd;
      color: #fff;
    }
    .item {
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding: 0.8rem 0;
    }
    .item img {
      width: 70px;
      border-radius: 10px;
      margin-right: 10px;
    }
    .precio {
      color: #f5a623;
      font-weight: bold;
    }
    .header-carrito {
      background: #9d4edd;
      border-radius: 15px;
      padding: 0.8rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-weight: bold;
    }
    .header-carrito .badge {
      background: #2b0040;
      color: #fff;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 50%;
      padding: 0.5rem 0.9rem;
    }
    .marco-morado {
      border: 3px solid #9d4edd;
      border-radius: 15px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    
    textarea {
      width: 100%;
      border-radius: 10px;
      border: none;
      padding: 0.6rem;
      resize: none;
    }

    .stars {
      display: flex;
      justify-content: center;
      margin-top: 1rem;
      gap: 5px;
    }
    .stars span {
      font-size: 1.8rem;
      cursor: pointer;
      color: #9d4edd;
    }
    .stars span:hover,
    .stars span.active {
      color: #f5a623;
    }
  </style>
</head>
<body>

  
  <div class="container position-absolute top-0 start-0 m-3">
    <a href="menu.html" class="btn btn-sm btn-outline-light">&larr; Volver</a>
  </div>

  <div class="card-carrito text-center">
    <h2>Carrito</h2>

    <div class="header-carrito">
      <span class="badge">2</span>
      <span>Items pedidos</span>
    </div>

    <div class="marco-morado">
  
      <div class="d-flex justify-content-center my-3 gap-2">
        <a href="carrito_pedido.html" class="tab-btn btn-dark">Pedido</a>
        <a href="carrito_envio.html" class="tab-btn btn-dark">Envío</a>
        <a href="carrito_calificacion.html" class="tab-btn active">Calificar</a>
      </div>
  
      <h5 class="text-start fw-bold mb-2 text-center">Pedido</h5>
    
  
      <div class="item d-flex align-items-center">
        <img src="img/pizza.jpg" alt="Pizza">
        <div class="text-start">
          <div>Muzza <span class="precio">$10.000,98</span></div>
          <small>1 Unidad/es</small>
        </div>
      </div>
      <div class="item d-flex align-items-center">
        <img src="img/pizza.jpg" alt="Pizza">
        <div class="text-start">
          <div>Muzza <span class="precio">$10.000,98</span></div>
          <small>1 Unidad/es</small>
        </div>
      </div>

  
      <div class="mt-3 text-start">
        <label for="comentarios"></label>
        <textarea id="comentarios" rows="2" placeholder="Comentarios:"></textarea>
      </div>

  
      <div class="stars">
        <span>★</span>
        <span>★</span>
        <span>★</span>
        <span>★</span>
        <span>★</span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
