<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotisería UM - Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: #1a1a2e;
      color: #fff;
      font-family: 'Poppins', Arial, sans-serif;
    }
    header {
      background: #9d4edd;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 0 0 15px 15px;
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    header img {
      height: 50px;
      border-radius: 50%;
    }
    .logo-text {
      font-size: 1.5rem;
      font-weight: bold;
      color: #fff;
    }
    .carrito {
      background: #2b0040;
      color: #fff;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      text-decoration: none; /* quita subrayado */
    }
    .carrito:hover {
      background: #4b0082;
    }
    .buscador input {
      border-radius: 20px;
      padding: 0.5rem 1rem;
    }
    .producto-card {
      background: #2b0040;
      border-radius: 15px;
      padding: 1rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .producto-card img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 10px;
    }
    .producto-info h5 {
      margin: 0;
      font-weight: bold;
    }
    .precio {
      color: #f5a623;
      font-weight: bold;
    }
  </style>
</head>
<body>

  
  <header>
    <div class="logo-container">
      <img src="imagenes/image (2).jpg" alt="Logo Rotisería">
      <span class="logo-text">Rotisería UM</span>
    </div>
    <a href="carrito_pedido.html" class="carrito">
      <i class="fas fa-user"></i> Mi cuenta
      <i class="fas fa-shopping-cart"></i> <span>0</span>
    </a>
  </header>

  
  <div class="container my-3 buscador">
    <input type="text" class="form-control" placeholder="🔍 Buscar...">
  </div>

  
  <div class="container">
    <div class="producto-card">
      <img src="imagenes/pizzas-muzzarella.jpg" alt="Producto">
      <div class="producto-info">
        <h5>Pizza Muzza</h5>
        <p>Clásica pizza de muzzarella con salsa de tomate y orégano.</p>
        <div class="precio">$10.000</div>
      </div>
    </div>

    <div class="producto-card">
      <img src="imagenes/Sin título.jpeg" alt="Producto">
      <div class="producto-info">
        <h5>Empanadas de Carne</h5>
        <p>Docena de empanadas mendocinas al horno.</p>
        <div class="precio">$8.500</div>
      </div>
    </div>

    <div class="producto-card">
      <img src="imagenes/Fugazzeta.png" alt="Producto">
      <div class="producto-info">
        <h5>Pizza estilo Fugazzeta</h5>
        <p>Cebolla, queso</p>
        <div class="precio">$12.000</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
