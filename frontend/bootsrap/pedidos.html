<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to bottom, #1a0633, #0a0420);
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .card {
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1rem;
    }
    .stats-card {
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: .75rem;
      text-align: center;
      padding: .75rem 0;
    }
    .badge-entregado {
      background-color: #198754; 
    }
    .badge-camino {
      background-color: #ffc107; 
      color: black;
    }
    .badge-cancelado {
      background-color: #dc3545;
    }
    .pedido-title {
      color: #e0e0ff;
      font-weight: bold;
      font-size: 1.1rem;
    }
    .pedido-cliente {
      color: #f8f9fa;
      font-weight: 500;
    }
    .pedido-detalle {
      color: #cfd1ff;
      font-size: 0.9rem;
    }
  </style>
</head>
<body class="p-3">


  <div class="mb-3">
    <a href="admin_menu.html" class="back-btn"><i class="bi bi-arrow-left"><button class="btn btn-outline-light btn-sm">&larr;</button></i></a>
    
    <span class="fs-4 ms-2 fw-bold">Pedidos</span>
  </div>


  <div class="row g-2 mb-4">
    <div class="col">
      <div class="stats-card">
        <div class="fs-5 fw-bold">23</div>
        <small>Pedidos hoy</small>
      </div>
    </div>
    <div class="col">
      <div class="stats-card">
        <div class="fs-5 fw-bold">$145K</div>
        <small>Ingresos hoy</small>
      </div>
    </div>
  </div>

  
  <div class="card mb-3 p-3">
    <div class="d-flex justify-content-between align-items-center">
      <div class="pedido-title">Pedido #1234</div>
      <span class="badge badge-entregado">Entregado</span>
    </div>
    <div class="pedido-cliente">Juan Pérez</div>
    <div class="pedido-detalle">2x Napolitana - $20.000</div>
    <div class="pedido-detalle">Hace 2 horas</div>
  </div>

  
  <div class="card mb-3 p-3">
    <div class="d-flex justify-content-between align-items-center">
      <div class="pedido-title">Pedido #1235</div>
      <span class="badge badge-camino">En camino</span>
    </div>
    <div class="pedido-cliente">María González</div>
    <div class="pedido-detalle">1x Muzzarella, 6x Empanadas - $13.500</div>
    <div class="pedido-detalle">Hace 15 min</div>
  </div>

  
  <div class="card mb-3 p-3">
    <div class="d-flex justify-content-between align-items-center">
      <div class="pedido-title">Pedido #1236</div>
      <span class="badge badge-cancelado">Cancelado</span>
    </div>
    <div class="pedido-cliente">Carlos Silva</div>
    <div class="pedido-detalle">1x Napolitana - $10.000</div>
    <div class="pedido-detalle">Hace 1 hora</div>
  </div>

</body>
</html>
