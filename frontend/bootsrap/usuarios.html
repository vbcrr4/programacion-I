<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios - Rotisería UM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(180deg, #1e003e, #000020);
      min-height: 100vh;
      padding: 2rem 0;
      color: #fff;
    }
    .back-btn {
      color: white;
      font-size: 1.5rem;
      text-decoration: none;
    }
    .back-btn:hover {
      color: #9b4dff;
    }
    .header-title {
      font-weight: 600;
      font-size: 1.4rem;
    }
    .stats-box {
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 0.5rem;
      text-align: center;
      padding: 1rem;
      font-weight: 600;
    }
    .user-card {
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .avatar {
      background-color: #7b3ce3;
      color: white;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    .status {
      font-size: 0.85rem;
    }
    .status.activo {
      color: #4caf50;
    }
    .status.bloqueado {
      color: #f44336;
    }
    .action-btn {
      border: none;
      border-radius: 0.5rem;
      padding: 0.3rem 0.6rem;
      font-size: 0.9rem;
    }
    .edit-btn {
      background-color: #9b4dff;
      color: white;
    }
    .delete-btn {
      background-color: #f44336;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
  
    <div class="d-flex align-items-center mb-4">
      <a href="admin_menu.html" class="back-btn me-3"><i class="bi bi-arrow-left"></i></a>
      <h1 class="header-title m-0">Usuarios</h1>
    </div>

  
    <div class="row g-3 mb-4">
      <div class="col-6">
        <div class="stats-box">
          <div style="font-size:1.5rem;">156</div>
          <div style="font-size:0.9rem;">Usuarios activos</div>
        </div>
      </div>
      <div class="col-6">
        <div class="stats-box">
          <div style="font-size:1.5rem;">12</div>
          <div style="font-size:0.9rem;">Nuevos hoy</div>
        </div>
      </div>
    </div>

  
    <div class="user-card">
      <div class="user-info">
        <div class="avatar">JP</div>
        <div>
          <div><strong>Juan Pérez</strong></div>
          <div style="font-size:0.9rem;">juan@email.com</div>
          <div class="status activo">Activo</div>
        </div>
      </div>
      <div>
        <button class="action-btn edit-btn"><i class="bi bi-pencil"></i></button>
        <button class="action-btn delete-btn ms-1"><i class="bi bi-x"></i></button>
      </div>
    </div>

    <div class="user-card">
      <div class="user-info">
        <div class="avatar">MG</div>
        <div>
          <div><strong>María González</strong></div>
          <div style="font-size:0.9rem;">maria@email.com</div>
          <div class="status activo">Activo</div>
        </div>
      </div>
      <div>
        <button class="action-btn edit-btn"><i class="bi bi-pencil"></i></button>
        <button class="action-btn delete-btn ms-1"><i class="bi bi-x"></i></button>
      </div>
    </div>

    <div class="user-card">
      <div class="user-info">
        <div class="avatar">CS</div>
        <div>
          <div><strong>Carlos Silva</strong></div>
          <div style="font-size:0.9rem;">carlos@email.com</div>
          <div class="status bloqueado">Bloqueado</div>
        </div>
      </div>
      <div>
        <button class="action-btn edit-btn"><i class="bi bi-check"></i></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
