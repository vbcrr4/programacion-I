<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Empleado - Rotisería UM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <style>
    :root {
      --color-primary: #8B45BD;
      --color-primary-30: rgba(139, 69, 189, 0.3);
      --color-primary-10: rgba(139, 69, 189, 0.1);
      --color-text: rgba(255, 255, 255, 0.7);
      --color-dark: #1a1a2e;
      --color-darker: #0d0d1a;
    }
    
    body {
      background: var(--color-dark);
      color: var(--color-text);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    .main-container {
      max-width: 400px;
      width: 100%;
    }
    
    .card {
      background: linear-gradient(135deg, var(--color-darker), #1b0026);
      border: 2px solid var(--color-primary);
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(139, 69, 189, 0.4);
      margin-bottom: 20px;
      overflow: hidden;
    }
    
    .card-header {
      background: var(--color-primary);
      color: white;
      text-align: center;
      font-weight: bold;
      font-size: 1.5rem;
      padding: 1rem;
      border: none;
    }
    
    .card-body {
      padding: 1.5rem;
    }
    
    .btn-employee {
      background: var(--color-primary);
      color: white;
      border: none;
      border-radius: 30px;
      padding: 0.8rem;
      width: 100%;
      margin-bottom: 12px;
      font-weight: bold;
      transition: all 0.3s;
    }
    
    .btn-employee:hover {
      background: #7839a3;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(139, 69, 189, 0.4);
    }
    
    .stats-card {
      text-align: center;
      padding: 1.2rem;
      background: var(--color-primary-10);
      border-radius: 12px;
      margin-bottom: 10px;
    }
    
    .stats-number {
      font-size: 2.5rem;
      font-weight: bold;
      color: var(--color-primary);
      margin-bottom: 0.3rem;
    }
    
    .stats-label {
      font-size: 0.9rem;
      color: var(--color-text);
    }
    
    .urgent-badge {
      background: #dc3545;
      color: white;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
    }
    
    .order-card {
      background: var(--color-primary-10);
      border-radius: 12px;
      padding: 15px;
      margin-top: 15px;
      border-left: 4px solid #dc3545;
    }
    
    .text-warning {
      color: #ffc107 !important;
    }
  </style>
</head>
<body>
  <div class="main-container">
    <!-- Encabezado -->
    <div class="card">
      <div class="card-header">
        Panel Empleado
      </div>
      <div class="card-body">
        <!-- Estadísticas -->
        <div class="row text-center mb-4">
          <div class="col-6">
            <div class="stats-card">
              <div class="stats-number">8</div>
              <div class="stats-label">Pendientes</div>
            </div>
          </div>
          <div class="col-6">
            <div class="stats-card">
              <div class="stats-number">3</div>
              <div class="stats-label">En preparación</div>
            </div>
          </div>
        </div>
        
        <!-- Botones de acción -->
        <div class="row mb-4">
          <div class="col-6">
            <a href="empleado_estado_pedido.html" class="btn btn-employee">
              <i class="bi bi-list-check me-1"></i> Ver Pedidos
            </a>
          </div>
          <div class="col-6">
            <button class="btn btn-employee">
              <i class="bi bi-box-seam me-1"></i> Verificar Stock
            </button>
          </div>
        </div>
        
        <div class="row">
          <div class="col-6">
            <button class="btn btn-employee">
              <i class="bi bi-person-check me-1"></i> Validar Cuentas
            </button>
          </div>
          <div class="col-6">
            <button class="btn btn-employee">
              <i class="bi bi-people me-1"></i> Gestionar Clientes
            </button>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Pedidos urgentes -->
    <div class="card">
      <div class="card-header">
        Pedidos Urgentes
      </div>
      <div class="card-body">
        <div class="order-card">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <h6 class="mb-0" style="color: white;">Pedido #1240</h6>
            <span class="urgent-badge">URGENTE</span>
          </div>
          <p class="mb-1">2x Napolitana</p>
          <p class="mb-1">María González - Zona Centro</p>
          <p class="text-warning mb-0"><small>Hace 5 min</small></p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
