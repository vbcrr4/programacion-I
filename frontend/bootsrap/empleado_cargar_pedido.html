<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cargar Pedido - Rotisería UM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <style>
    body {
      background: linear-gradient(180deg, #1e003e, #000020);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      padding: 1rem;
    }
    
    .main-container {
      max-width: 400px;
      width: 100%;
    }
    
    .card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
      margin-bottom: 20px;
      overflow: hidden;
    }
    
    .card-header {
      color: white;
      text-align: center;
      font-weight: bold;
      font-size: 1.5rem;
      padding: 1rem;
      border: none;
    }
    
    .card-body {
      padding: 1.5rem;
    }
    
    .form-label {
      color: #fff;
      font-weight: bold;
      margin-bottom: 8px;
      display: block;
    }
    
    .form-control {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid #9b4dff;
      color: #fff;
      border-radius: 10px;
      padding: 10px 15px;
      width: 100%;
    }
    
    .form-control:focus {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border-color: #9b4dff;
      box-shadow: 0 0 0 0.2rem rgba(155, 77, 255, 0.25);
    }
    
    .products-section {
      margin: 20px 0;
      padding: 15px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      border: 1px solid rgba(155, 77, 255, 0.3);
    }
    
    .section-title {
      color: #fff;
      font-weight: bold;
      margin-bottom: 15px;
      font-size: 1.1rem;
      border-bottom: 1px solid rgba(155, 77, 255, 0.3);
      padding-bottom: 8px;
    }
    
    .product-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      margin-bottom: 10px;
      background: rgba(155, 77, 255, 0.1);
      border-radius: 8px;
    }
    
    .product-info {
      flex-grow: 1;
    }
    
    .product-name {
      font-weight: bold;
      color: #fff;
      margin: 0;
    }
    
    .product-price {
      color: #ffc107;
      font-weight: bold;
      margin: 0;
    }
    
    .delete-btn {
      background: #e63946;
      color: white;
      border: none;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .delete-btn:hover {
      background: #c1121f;
      transform: scale(1.1);
    }
    
    .summary-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      color: #bbb;
    }
    
    .total {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      font-size: 1.1rem;
      color: #fff;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid rgba(155, 77, 255, 0.3);
    }
    
    .btn-confirm {
      background: #9b4dff;
      color: #fff;
      border: none;
      border-radius: 30px;
      padding: 12px;
      width: 100%;
      font-weight: bold;
      font-size: 1.1rem;
      margin-top: 20px;
      transition: all 0.3s;
    }
    
    .btn-confirm:hover {
      background: #7b3ce3;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(155, 77, 255, 0.4);
    }
    
    .back-btn {
      position: absolute;
      top: 1rem;
      left: 1rem;
      color: white;
      font-size: 1.5rem;
      text-decoration: none;
    }
    
    .back-btn:hover { 
      color: #9b4dff; 
    }
    
    select.form-control {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 15px center;
      background-size: 15px;
    }
    
    textarea.form-control {
      min-height: 80px;
      resize: vertical;
    }
    
    .payment-section {
      margin: 20px 0;
      padding: 15px;
      background: #ffffff14;
      border-radius: 10px;
      border: 1px solid rgba(250, 250, 250, 0.3);
    }
  </style>
</head>
<body>


  <a href="admin_menu.html" class="back-btn"><i class="bi bi-arrow-left"></i></a>

  <div class="main-container">

    <div class="card">
      <div class="card-header">
        Cargar Pedido
      </div>
      <div class="card-body">

        <div class="mb-4">
          <label class="form-label">Cliente</label>
          <input type="text" class="form-control" placeholder="Buscar cliente...">
        </div>


        <div class="products-section">
          <div class="section-title">Productos Seleccionados</div>
          <div class="product-item">
            <div class="product-info">
              <p class="product-name">Napolitana x2</p>
              <p class="product-price">$20.000</p>
            </div>
            <button class="delete-btn" title="Eliminar producto">
              <i class="bi bi-x"></i>
            </button>
          </div>
          <div class="product-item">
            <div class="product-info">
              <p class="product-name">Empanadas x6</p>
              <p class="product-price">$4.250</p>
            </div>
            <button class="delete-btn" title="Eliminar producto">
              <i class="bi bi-x"></i>
            </button>
          </div>
        </div>


        <div class="payment-section">
          <label class="form-label">Método de pago</label>
          <select class="form-control">
            <option>Efectivo</option>
            <option>Tarjeta de crédito</option>
            <option>Tarjeta de débito</option>
            <option>Transferencia</option>
          </select>
        </div>

        <div class="mb-4">
          <label class="form-label">Dirección de entrega</label>
          <textarea class="form-control" placeholder="Dirección completa..."></textarea>
        </div>


        <div class="mb-4">
          <div class="summary-item">
            <span>Subtotal:</span>
            <span>$24.250</span>
          </div>
          <div class="summary-item">
            <span>Envío:</span>
            <span>$0</span>
          </div>
          <div class="summary-item">
            <span>Descuento:</span>
            <span>$0</span>
          </div>
          <div class="total">
            <span>Total:</span>
            <span>$24.250</span>
          </div>
        </div>


        <button class="btn-confirm">Confirmar Pedido</button>
      </div>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>

    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        const productItem = this.closest('.product-item');
        productItem.style.opacity = '0';
        setTimeout(() => {
          productItem.remove();
          // Aquí iría la lógica para actualizar el total
        }, 300);
      });
    });
  </script>
</body>
</html>
