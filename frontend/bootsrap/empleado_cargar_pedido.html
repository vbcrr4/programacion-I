<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargar Pedido - Rotisería UM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <style>
    :root {
      --color-primary: #8B45BD;
      --color-primary-30: rgba(139, 69, 189, 0.3);
      --color-primary-10: rgba(139, 69, 189, 0.1);
      --color-text: rgba(255, 255, 255, 0.7);
      --color-dark: #1a1a2e;
      --color-darker: #0d0d1a;
      --color-white-100: #FFFFFF;
      --color-white-70: rgba(255, 255, 255, 0.7);
      --color-white-80: rgba(255, 255, 255, 0.8);
      --color-white-5: rgba(255, 255, 255, 0.05);
      --color-red: #DC3545;
    }
    
    body {
      background: var(--color-dark);
      color: var(--color-white-70);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    .main-container {
      max-width: 400px;
      width: 100%;
    }
    
    .card {
      background: linear-gradient(135deg, var(--color-darker), #1b0026);
      border: 2px solid var(--color-primary);
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(139, 69, 189, 0.4);
      margin-bottom: 20px;
      overflow: hidden;
    }
    
    .card-header {
      background: var(--color-primary);
      color: var(--color-white-100);
      text-align: center;
      font-weight: bold;
      font-size: 1.5rem;
      padding: 1rem;
      border: none;
    }
    
    .card-body {
      padding: 1.5rem;
    }
    
    .form-label {
      color: var(--color-white-100);
      font-weight: bold;
      margin-bottom: 8px;
      display: block;
    }
    
    .form-control {
      background: var(--color-white-5);
      border: 1px solid var(--color-primary);
      color: var(--color-white-100);
      border-radius: 10px;
      padding: 10px 15px;
      width: 100%;
    }
    
    .form-control:focus {
      background: var(--color-white-5);
      color: var(--color-white-100);
      border-color: var(--color-primary);
      box-shadow: 0 0 0 0.2rem rgba(139, 69, 189, 0.25);
    }
    
    .products-section {
      margin: 20px 0;
      padding: 15px;
      background: var(--color-white-5);
      border-radius: 10px;
      border: 1px solid var(--color-primary-30);
    }
    
    .section-title {
      color: var(--color-white-100);
      font-weight: bold;
      margin-bottom: 15px;
      font-size: 1.1rem;
      border-bottom: 1px solid var(--color-primary-30);
      padding-bottom: 8px;
    }
    
    .product-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      margin-bottom: 10px;
      background: var(--color-primary-10);
      border-radius: 8px;
    }
    
    .product-info {
      flex-grow: 1;
    }
    
    .product-name {
      font-weight: bold;
      color: var(--color-white-100);
      margin: 0;
    }
    
    .product-price {
      color: #f5a623;
      font-weight: bold;
      margin: 0;
    }
    
    .delete-btn {
      background: var(--color-red);
      color: white;
      border: none;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .delete-btn:hover {
      background: #bd2130;
      transform: scale(1.1);
    }
    
    .summary-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      color: var(--color-white-80);
    }
    
    .total {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      font-size: 1.1rem;
      color: var(--color-white-100);
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid var(--color-primary-30);
    }
    
    .btn-confirm {
      background: var(--color-primary);
      color: var(--color-white-100);
      border: none;
      border-radius: 30px;
      padding: 12px;
      width: 100%;
      font-weight: bold;
      font-size: 1.1rem;
      margin-top: 20px;
      transition: all 0.3s;
    }
    
    .btn-confirm:hover {
      background: #7839a3;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(139, 69, 189, 0.4);
    }
    
    .back-button {
      background: var(--color-primary);
      color: var(--color-white-100);
      border: none;
      border-radius: 30px;
      padding: 10px 20px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .back-button:hover {
      background: #7839a3;
    }
    
    select.form-control {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 15px center;
      background-size: 15px;
    }
    
    textarea.form-control {
      min-height: 80px;
      resize: vertical;
    }
    
    .payment-section {
      margin: 20px 0;
      padding: 15px;
      background: var(--color-white-5);
      border-radius: 10px;
      border: 1px solid var(--color-primary-30);
    }
  </style>
</head>
<body>
  <div class="main-container">
    <!-- Botón de volver -->
    <button class="back-button" onclick="window.location.href='empleado_panel.html'">
      <i class="bi bi-arrow-left"></i> Volver al Panel
    </button>

    <!-- Cargar pedido -->
    <div class="card">
      <div class="card-header">
        Cargar Pedido
      </div>
      <div class="card-body">
        <!-- Cliente -->
        <div class="mb-4">
          <label class="form-label">Cliente</label>
          <input type="text" class="form-control" placeholder="Buscar cliente...">
        </div>

        <!-- Productos seleccionados -->
        <div class="products-section">
          <div class="section-title">Productos Seleccionados</div>
          <div class="product-item">
            <div class="product-info">
              <p class="product-name">Napolitana x2</p>
              <p class="product-price">$20.000</p>
            </div>
            <button class="delete-btn" title="Eliminar producto">
              <i class="bi bi-x"></i>
            </button>
          </div>
          <div class="product-item">
            <div class="product-info">
              <p class="product-name">Empanadas x6</p>
              <p class="product-price">$4.250</p>
            </div>
            <button class="delete-btn" title="Eliminar producto">
              <i class="bi bi-x"></i>
            </button>
          </div>
        </div>

        <!-- Método de pago -->
        <div class="payment-section">
          <label class="form-label">Método de pago</label>
          <select class="form-control">
            <option>Efectivo</option>
            <option>Tarjeta de crédito</option>
            <option>Tarjeta de débito</option>
            <option>Transferencia</option>
          </select>
        </div>

        <!-- Dirección de entrega -->
        <div class="mb-4">
          <label class="form-label">Dirección de entrega</label>
          <textarea class="form-control" placeholder="Dirección completa..."></textarea>
        </div>

        <!-- Resumen del pedido -->
        <div class="mb-4">
          <div class="summary-item">
            <span>Subtotal:</span>
            <span>$24.250</span>
          </div>
          <div class="summary-item">
            <span>Envío:</span>
            <span>$0</span>
          </div>
          <div class="summary-item">
            <span>Descuento:</span>
            <span>$0</span>
          </div>
          <div class="total">
            <span>Total:</span>
            <span>$24.250</span>
          </div>
        </div>

        <!-- Botón de confirmar -->
        <button class="btn-confirm">Confirmar Pedido</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Funcionalidad para eliminar productos
    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        const productItem = this.closest('.product-item');
        productItem.style.opacity = '0';
        setTimeout(() => {
          productItem.remove();
          // Aquí iría la lógica para actualizar el total
        }, 300);
      });
    });
  </script>
</body>
</html>
