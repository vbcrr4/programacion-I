<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Envío - Rotisería UM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <style>
    body {
      background: linear-gradient(180deg, #1e003e, #000020);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .carrito-card {
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 1.2rem;
      padding: 1rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
    }
    .header-badge {
      background: #9b4dff;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:  0.8rem;
      margin-bottom: 1rem;
      gap: 10px;
    }
    .header-badge .badge {
      background: #5c0ad6;
      margin-right: 0.5rem;
      border-radius: 50%;
    }
    .marco-morado {
      border: 3px solid #9b4dff;
      border-radius: 15px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .nav-tabs {
      border-bottom: none;
      justify-content: center;
      margin-bottom: 1rem;
    }
    .nav-tabs .nav-link {
      border: none;
      border-radius: 50rem;
      padding: 0.4rem 1rem;
      color: #fff;
      background-color: #2b0040;
      margin: 0 0.3rem;
      text-decoration: none;
    }
    .nav-tabs .nav-link.active {
      background-color: #9b4dff;
      font-weight: bold;
    }
    .info-envio {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 15px;
      margin-top: 15px;
    }
    .mapa {
      border-radius: 0.8rem;
      overflow: hidden;
      margin-top: 1rem;
    }
    .mapa img {
      width: 100%;
      border-radius: 0.8rem;
    }
    .direccion {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 15px;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <!-- Botón Volver -->
  <div class="container position-absolute top-0 start-0 m-3">
    <a href="menu.html" class="btn btn-sm btn-outline-light">&larr; Volver</a>
  </div>

  <div class="carrito-card">
    <h4 class="text-center mb-2">Carrito</h4>
    
    <!-- Badge -->
    <div class="text-center">
      <span class="header-badge">
        <span class="badge">2</span> Items pedidos
      </span>
    </div>

    <div class="marco-morado">
      <!-- Tabs como links -->
      <ul class="nav nav-tabs justify-content-center">
        <li class="nav-item"><a class="nav-link" href="carrito_pedido.html">Pedido</a></li>
        <li class="nav-item"><a class="nav-link active" href="carrito_envio.html">Envío</a></li>
        <li class="nav-item"><a class="nav-link" href="carrito_calificacion.html">Calificar</a></li>
      </ul>
  
      <!-- Contenido -->
      <div class="info-envio text-start">
        <p><strong>Precio del Envío:</strong> $5.000</p>
        <p><strong>Estado del envío:</strong> En camino</p>
      </div>
      <div class="direccion text-start">
        <img src="https://i.imgur.com/FoM6uXK.png" alt="Mapa de envío">
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
