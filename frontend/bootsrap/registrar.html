<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotisería UM - Crear Cuenta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #1a1a2e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .register-card {
      background: linear-gradient(160deg, #1b0026, #1a003d);
      color: #fff;
      border-radius: 2rem;
      padding: 2rem;
      box-shadow: 0 0 25px rgba(0,0,0,0.5);
      max-width: 400px;
      width: 100%;
    }
    .form-control {
      background: transparent;
      border: 1px solid #6f42c1;
      border-radius: 2rem;
      color: #fff;
    }
    .form-control::placeholder {
      color: #aaa;
    }
    .btn-register {
      background-color: #a445f7;
      border: none;
      border-radius: 2rem;
      font-weight: bold;
      color: #fff;
      padding: 0.75rem;
      width: 100%;
      transition: background 0.3s;
    }
    .btn-register:hover {
      background-color: #8a2be2;
    }
    .extra-links a {
      color: #a445f7;
      text-decoration: none;
    }
    .extra-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="register-card">
    <h2 class="text-center mb-4">Crear Cuenta</h2>
    <form>
      <div class="mb-3">
        <input type="text" class="form-control" placeholder="Nombre completo">
      </div>
      <div class="mb-3">
        <input type="email" class="form-control" placeholder="Email">
      </div>
      <div class="mb-3">
        <input type="password" class="form-control" placeholder="Contraseña">
      </div>
      <div class="mb-3">
        <input type="password" class="form-control" placeholder="Confirmar contraseña">
      </div>
      <button type="submit" class="btn-register">REGISTRARSE</button>
    </form>
    <div class="text-center mt-3 extra-links">
      <span>¿Ya tenés cuenta? <a href="login.html">Inicia sesión</a></span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
