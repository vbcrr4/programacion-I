<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Panel Administrador - Rotisería UM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <style>
    body {
      background: linear-gradient(180deg, #1e003e, #000020);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      padding: 1rem;
    }
    .admin-card {
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 1.2rem;
      padding: 1rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
    }
    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
      margin-bottom: 1.5rem;
    }
    .action-btn {
      background-color: rgba(255, 255, 255, 0.08);
      border: none;
      border-radius: 0.75rem;
      padding: 1rem 0.5rem;
      color: #fff;
      text-align: center;
      transition: all 0.3s ease;
      height: 90px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-decoration: none;
    }
    .action-btn:hover {
      background-color: rgba(155, 77, 255, 0.2);
      transform: translateY(-3px);
      color: #fff;
    }
    .action-icon {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #9b4dff;
    }
    .action-text {
      font-size: 0.85rem;
    }
    .title-container {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .main-title {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }
    .back-btn {
      position: absolute;
      top: 1rem;
      left: 1rem;
      color: white;
      font-size: 1.5rem;
      text-decoration: none;
    }
    .back-btn:hover { 
      color: #9b4dff; 
    }
  </style>
</head>
<body>
  <div class="admin-card">
    <div class="title-container">
      <div class="main-title">Panel Administrador</div>
    </div>

    
    <div class="actions-grid">
      <a href="gestion_menu.html" class="action-btn">
        <div class="action-icon"><i class="bi bi-card-list"></i></div>
        <div class="action-text">Gestión Menú</div>
      </a>
      <a href="nuevo_producto.html" class="action-btn">
        <div class="action-icon"><i class="bi bi-plus-circle"></i></div>
        <div class="action-text">Nuevo Producto</div>
      </a>
      <a href="pedidos.html" class="action-btn">
        <div class="action-icon"><i class="bi bi-receipt-cutoff"></i></div>
        <div class="action-text">Pedidos</div>
      </a>
      <a href="usuarios.html" class="action-btn">
        <div class="action-icon"><i class="bi bi-people"></i></div>
        <div class="action-text">Usuarios</div>
      </a>
      <a href="promociones.html" class="action-btn">
        <div class="action-icon"><i class="bi bi-stars"></i></div>
        <div class="action-text">Promociones</div>
      </a>
    </div>
  </div>

  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
