<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo Producto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to bottom, #1a0633, #0a0420);
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 2rem 1rem;
    }
    .card-form {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(180deg, #2a0d50, #1a0633);
      border-radius: 1rem;
      padding: 1.5rem;
      box-shadow: 0px 0px 25px rgba(0,0,0,0.4);
    }
    .back-btn {
    background: rgba(255,255,255,0.15);
    border: none;
    border-radius: 20%;
    width: 40px;   
    height: 40px;  
    color: white;
    font-size: 1.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
    .form-label {
      font-weight: 500;
      margin-bottom: 0.3rem;
      color: #e0e0ff;
    }
    .form-control {
      background-color: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 0.5rem;
      color: white;
    }
    .form-control::placeholder {
      color: #c7c7d1;
      opacity: 0.8;
    }
    .form-control:focus {
      border-color: #9d4edd;
      box-shadow: 0 0 5px #9d4edd;
    }
    .btn-guardar {
      background: #9d4edd;
      border: none;
      border-radius: 0.5rem;
      font-weight: bold;
      padding: 0.8rem;
      width: 100%;
    }
    .btn-guardar:hover {
      background: #7c2bbf;
    }
  </style>
</head>
<body>

  <div class="card-form">
    <!-- Botón volver -->
    <div class="d-flex align-items-center mb-3">
      <button class="back-btn">&larr;</button>
      <h4 class="ms-3 mb-0 fw-bold">Nuevo Producto</h4>
    </div>

    <!-- Formulario -->
    <form>
      <div class="mb-3">
        <label class="form-label">Nombre del producto</label>
        <input type="text" class="form-control" placeholder="Ej: Pizza Napolitana">
      </div>

      <div class="mb-3">
        <label class="form-label">Precio</label>
        <input type="number" class="form-control" placeholder="10000">
      </div>

      <div class="mb-3">
        <label class="form-label">Categoría</label>
        <input type="text" class="form-control" placeholder="Pizzas">
      </div>

      <div class="mb-3">
        <label class="form-label">Descripción</label>
        <textarea class="form-control" rows="3" placeholder="Describe el producto..."></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">Imagen</label>
        <input type="file" class="form-control">
      </div>

      <button type="submit" class="btn btn-guardar text-white">Guardar Producto</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
